<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Zen Word — Relax Puzzle Game</title>
<meta name="description" content="A calming word-connect puzzle game. Drag letters to fill the crossword and unwind." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2224%22 fill=%22%23276560%22/><path d=%22M50 20c12 12 12 24 0 36s-12 24 0 36%22 fill=%22none%22 stroke=%22%23f7f1e3%22 stroke-width=%225%22 stroke-linecap=%22round%22/><circle cx=%2250%22 cy=%2250%22 r=%226%22 fill=%22%23dba43f%22/></svg>" />
<link rel="icon" sizes="32x32" href="icons/favicon-32.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#276560" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Zen Word" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">

  <!-- MENU SCREEN -->
  <section id="menu-screen" class="screen">
    <div class="menu-blob blob-a"></div>
    <div class="menu-blob blob-b"></div>
    <header class="menu-header">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="46" height="46">
          <circle cx="32" cy="32" r="30" fill="none" stroke="currentColor" stroke-width="2" opacity="0.35"/>
          <path d="M32 8c8 8 8 16 0 24s-8 16 0 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M32 8c-8 8-8 16 0 24s8 16 0 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
          <circle cx="32" cy="32" r="4" fill="currentColor"/>
        </svg>
      </div>
      <h1>Zen&nbsp;Word</h1>
      <p class="tagline">A quiet little puzzle to unwind with</p>
      <div class="currency-pill" title="Hints available">
        <span class="bulb">✦</span><span id="hint-count">3</span>
      </div>
    </header>
    <div id="level-path" class="level-path"></div>
    <footer class="menu-footer">
      Progress is saved automatically on this device.
      <br>Music: &ldquo;The Long Dark&rdquo; by <a href="https://www.scottbuckley.com.au/library/the-long-dark/" target="_blank" rel="noopener">Scott Buckley</a>, CC BY 4.0.
    </footer>
  </section>

  <!-- GAME SCREEN -->
  <section id="game-screen" class="screen hidden">
    <div class="scenery" id="scenery">
      <div class="motes" aria-hidden="true">
        <span class="mote m1"></span><span class="mote m2"></span><span class="mote m3"></span>
        <span class="mote m4"></span><span class="mote m5"></span><span class="mote m6"></span>
      </div>
    </div>

    <header class="game-header">
      <button id="back-btn" class="icon-btn" aria-label="Back to levels">‹</button>
      <div class="level-info">
        <div class="level-name" id="level-name">Level 1</div>
        <div class="level-progress" id="level-progress">0 / 0 words</div>
      </div>
      <div class="header-actions">
        <button id="music-btn" class="icon-btn" aria-label="Toggle music" aria-pressed="false">
          <svg class="round-icon icon-music-on" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 8H5a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h4l5 4V4L9 8z"/>
            <path d="M16.2 8.8a5 5 0 0 1 0 6.4"/>
            <path d="M18.6 6.2a8.5 8.5 0 0 1 0 11.6"/>
          </svg>
          <svg class="round-icon icon-music-off hidden" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 8H5a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h4l5 4V4L9 8z"/>
            <line x1="16.5" y1="8.5" x2="22" y2="15.5"/>
            <line x1="22" y1="8.5" x2="16.5" y2="15.5"/>
          </svg>
        </button>
        <button id="restart-btn" class="icon-btn" aria-label="Restart level">↺</button>
      </div>
    </header>

    <div class="game-body" id="game-body">
      <div class="grid-wrap">
        <div id="crossword-grid" class="crossword-grid"></div>
      </div>

      <div class="wheel-area">
        <div class="word-row" id="word-row">
          <div class="current-word" id="current-word"></div>
          <button id="confirm-btn" class="confirm-btn" aria-label="Submit word">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 12l6 6L20 6"/>
            </svg>
          </button>
        </div>

        <div class="wheel-row">
          <button id="shuffle-btn" class="round-btn" aria-label="Shuffle letters">
            <svg class="round-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 6h3.5c1.5 0 2.3 1 3 2l5 8c.7 1 1.5 2 3 2H21"/>
              <path d="M17 4l4 2-4 2"/>
              <path d="M3 18h3.5c1.5 0 2.3-1 3-2l1.2-2"/>
              <path d="M17 20l4-2-4-2"/>
            </svg>
          </button>

          <div id="wheel" class="wheel">
            <svg id="wheel-lines" class="wheel-lines"></svg>
            <div class="wheel-hub" id="wheel-hub" aria-label="Submit word"></div>
          </div>

          <button id="hint-btn" class="round-btn" aria-label="Use a hint">
            <svg class="round-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 18h6"/>
              <path d="M10 22h4"/>
              <path d="M12 2a6.5 6.5 0 0 0-4 11.6c.7.6 1 1.3 1 2.1V16h6v-.3c0-.8.3-1.5 1-2.1A6.5 6.5 0 0 0 12 2z"/>
            </svg>
            <span class="round-badge" id="hint-badge">3</span>
          </button>
        </div>
      </div>
    </div>

    <div id="toast" class="toast"></div>
  </section>

  <!-- LEVEL COMPLETE MODAL -->
  <div id="complete-modal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-stars" id="modal-stars">
        <span class="star">★</span><span class="star">★</span><span class="star">★</span>
      </div>
      <h2>Level Complete</h2>
      <p id="modal-sub">You found every word.</p>
      <div class="modal-actions">
        <button id="modal-menu-btn" class="secondary-btn">Levels</button>
        <button id="modal-next-btn" class="primary-btn">Next Level</button>
      </div>
    </div>
  </div>

  <!-- CHAPTER COMPLETE MODAL -->
  <div id="chapter-modal" class="modal hidden">
    <div class="modal-card">
      <h2 id="chapter-title">Chapter Complete</h2>
      <p id="chapter-sub">You've cleared this scene.</p>
      <div class="modal-actions">
        <button id="chapter-menu-btn" class="primary-btn">Continue</button>
      </div>
    </div>
  </div>

</div>

<script src="levels.js"></script>
<script src="crossword.js"></script>
<script src="audio.js"></script>
<script src="game.js"></script>
</body>
</html>
